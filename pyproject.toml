[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewpie-layout-engine"
version = "0.1.0"
description = "Layout validation/normalization service for viewpie video walls (square-grid constraint)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Generated with assistance from Qwen AI" }]
keywords = ["viewpie", "video-wall", "layout", "fastapi", "raspberry-pi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.setuptools]
packages = ["viewpie_layout_engine"]

[tool.pytest.ini_options]
testpaths = ["viewpie_layout_engine/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["viewpie_layout_engine"]
omit = ["viewpie_layout_engine/tests/*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
